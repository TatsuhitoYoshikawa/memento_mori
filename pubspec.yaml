name: memento_mori
description: "残り寿命をリアルタイムにカウントダウンするアプリ（メメント・モリ）"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: 3.14.1
  flutter: 3.50.1

dependencies:
  flutter:
    sdk: flutter
  intl: ^0.20.3
  shared_preferences: ^2.5.6
  country_picker: ^2.0.28
  # 暖色デザイン用フォント（Shippori Mincho / Zen Kaku Gothic New / Roboto）
  google_fonts: ^9.0.0
  material_ui: ^1.11.1
  cupertino_ui: ^1.1.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/life_table.json

# アプリアイコン生成設定（dart run flutter_launcher_icons で適用）。
# マスター(不透明・角丸なし)を iOS/汎用に、Android はアダプティブ2レイヤーを使用。
flutter_launcher_icons:
  ios: true
  android: true
  remove_alpha_ios: true
  image_path: "icons/memento_icon_1024.png"
  adaptive_icon_background: "icons/android/memento_bg_1024.png"
  adaptive_icon_foreground: "icons/android/memento_fg_1024.png"
